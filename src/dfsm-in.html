<script type="text/javascript">
    (function() {
        function parseStatesFromConfig(configNodeId) {
            const configNode = RED.nodes.node(configNodeId);

            if (!configNode || !configNode.states) {
                return [];
            }

            try {
                const parsed = JSON.parse(configNode.states);
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                return [];
            }
        }

        function parseStoredAllowableStates(rawValue) {
            if (Array.isArray(rawValue)) {
                return rawValue
                    .filter(function(entry) { return typeof entry === "string"; })
                    .map(function(entry) { return entry.trim(); })
                    .filter(function(entry, index, all) { return entry && all.indexOf(entry) === index; });
            }

            if (typeof rawValue !== "string" || !rawValue.trim()) {
                return [];
            }

            const trimmedValue = rawValue.trim();

            if (trimmedValue.startsWith("[")) {
                try {
                    const parsed = JSON.parse(trimmedValue);
                    if (Array.isArray(parsed)) {
                        return parseStoredAllowableStates(parsed);
                    }
                } catch (error) {
                    // Fall through to legacy comma-separated parsing.
                }
            }

            return trimmedValue.split(",")
                .map(function(entry) { return entry.trim(); })
                .filter(function(entry, index, all) { return entry && all.indexOf(entry) === index; });
        }

        RED.nodes.registerType("dfsm-in", {
            category: "state machine",
            color: "#d9edf7",
            defaults: {
                name: { value: "" },
                fsm: { value: "", type: "dfsm-config", required: true },
                retrigger: { value: true },
                defaultState: { value: "" },
                allowablePreviousStates: { value: "" }
            },
            inputs: 1,
            outputs: 0,
            icon: "font-awesome/fa-sign-in",
            label: function() {
                return this.name || "dfsm-in";
            },
            oneditprepare: function() {
                const fsmField = $("#node-input-fsm");
                const defaultStateField = $("#node-input-defaultState");
                const allowableStatesField = $("#node-input-allowablePreviousStates-select");
                const allowableStatesStorageField = $("#node-input-allowablePreviousStates");
                const currentValue = this.defaultState;
                const currentAllowableStates = parseStoredAllowableStates(this.allowablePreviousStates);

                function refreshDefaultStates(preferredValue) {
                    const states = parseStatesFromConfig(fsmField.val());
                    defaultStateField.empty();
                    defaultStateField.append($("<option></option>").val("").text("(none)"));

                    states.forEach(function(state) {
                        defaultStateField.append($("<option></option>").val(state).text(state));
                    });

                    defaultStateField.val(preferredValue || "");
                }

                function refreshAllowableStates(preferredStates) {
                    const states = parseStatesFromConfig(fsmField.val());
                    const selectedSet = new Set(preferredStates || []);

                    allowableStatesField.empty();

                    states.forEach(function(state) {
                        const option = $("<option></option>").val(state).text(state);
                        if (selectedSet.has(state)) {
                            option.prop("selected", true);
                        }
                        allowableStatesField.append(option);
                    });
                }

                fsmField.on("change", function() {
                    const currentlySelectedAllowableStates = allowableStatesField.val() || [];
                    refreshDefaultStates(defaultStateField.val());
                    refreshAllowableStates(currentlySelectedAllowableStates);
                });

                refreshDefaultStates(currentValue);
                refreshAllowableStates(currentAllowableStates);

                if (allowableStatesStorageField.val()) {
                    // Keep legacy/loaded value visible until save.
                    allowableStatesStorageField.val(JSON.stringify(currentAllowableStates));
                }
            },
            oneditsave: function() {
                const selectedAllowableStates = $("#node-input-allowablePreviousStates-select").val() || [];
                $("#node-input-allowablePreviousStates").val(JSON.stringify(selectedAllowableStates));
            }
        });
    })();
</script>

<script type="text/x-red" data-template-name="dfsm-in">
    <div class="form-row">
        <label for="node-input-name"><i class="icon-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-fsm"><i class="fa fa-sitemap"></i> FSM</label>
        <input type="text" id="node-input-fsm">
    </div>
    <div class="form-row">
        <label for="node-input-defaultState"><i class="fa fa-arrow-right"></i> Default state</label>
        <select id="node-input-defaultState" style="width: 70%;"></select>
    </div>
    <!-- Temporarily disabled while global FSM transition rules are the primary mechanism.
    <div class="form-row">
        <label for="node-input-allowablePreviousStates"><i class="fa fa-filter"></i> Allowable Previous States</label>
        <input type="hidden" id="node-input-allowablePreviousStates">
        <select id="node-input-allowablePreviousStates-select" multiple style="width: 70%; min-height: 120px;"></select>
    </div>
    -->
    <div class="form-row">
        <label for="node-input-retrigger"><i class="fa fa-refresh"></i> Allow retrigger</label>
        <input type="checkbox" id="node-input-retrigger" style="display: inline-block; width: auto; vertical-align: top;">
    </div>
</script>

<script type="text/x-red" data-help-name="dfsm-in">
    <p>Accepts a request for the next FSM state and forwards a normalized transition request into the retained FSM instance.</p>

    <h4>Configuration</h4>
    <ul>
        <li><code>Default state</code>: optional fallback when <code>msg.payload.state</code> is missing</li>
        <li><code>Allow retrigger</code>: allows same-state requests to emit retrigger events</li>
    </ul>

    <p>This node may also be subject to the FSM config node's optional global allowed-transition table.</p>
    <ul>
        <li>The older local present-state filter is currently disabled in the editor and ignored at runtime.</li>
        <li>The FSM config node applies any configured global <code>from -> to</code> transition rules.</li>
        <li>If the global rule check rejects a transition, <code>dfsm-in</code> calls <code>node.warn(...)</code>, shows red status text <code>illegal transition</code>, and the structured error is available through <code>dfsm-error</code>.</li>
    </ul>

    <h4>Input</h4>
    <p>Reads from <code>msg.payload</code> with this first-pass shape:</p>
    <pre>{
  state?: string,
  context?: object,
  replaceContext?: boolean
}</pre>
    <ul>
        <li><code>state</code>: requested next state</li>
        <li><code>context</code>: shallow-merged into the retained FSM context</li>
        <li><code>replaceContext</code>: when <code>true</code>, replaces the full retained context with <code>context</code></li>
    </ul>
    <p>If <code>msg.payload.state</code> is missing, the node may use the configured default next state. Same-state requests are allowed by default and become explicit retrigger events.</p>
    <p>This node does not emit messages directly. Accepted events are published through <code>dfsm-out</code> nodes, and rejected requests are published through <code>dfsm-error</code> nodes.</p>
</script>
