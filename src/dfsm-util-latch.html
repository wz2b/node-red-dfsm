<script type="text/javascript">
    RED.nodes.registerType("dfsm-util-latch", {
        category: "state machine",
        color: "#fff3cd",
        defaults: {
            name:        { value: "" },
            bufferMode:  { value: "one" },
            queueMode:   { value: "release-all" },
            triggerMode: { value: "edge" },
            triggerSource: { value: "topic" },
            triggerRuleProperty: { value: "payload" },
            triggerRuleOperator: { value: "exists" },
            triggerRuleValue: { value: "" },
            triggerRuleValueType: { value: "str" },
            releaseFormat: { value: "individual" }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-pause-circle",
        outputLabels: ["msg"],
        label: function() {
            if (this.name) { return this.name; }
            var modeLabel = this.triggerMode === "gate" ? "gate" : "edge";
            return "latch (" + modeLabel + ")";
        },
        oneditprepare: function() {
            var triggerModeField = $("#node-input-triggerMode");
            var queueModeRow     = $("#dfsm-latch-queuemode-row");
            var bufferModeRow    = $("#dfsm-latch-buffermode-row");
            var releaseFormatRow = $("#dfsm-latch-releaseformat-row");
            var triggerSourceField = $("#node-input-triggerSource");
            var triggerRuleRow = $("#dfsm-latch-triggerrule-row");
            var triggerRuleValueRow = $("#dfsm-latch-triggerrule-value-row");
            var triggerRuleOperatorField = $("#node-input-triggerRuleOperator");
            var triggerRulePropertyField = $("#node-input-triggerRuleProperty");
            var triggerRuleValueField = $("#node-input-triggerRuleValue");

            triggerRulePropertyField.typedInput({
                default: "msg",
                types: ["msg"]
            });

            triggerRuleValueField.typedInput({
                default: "str",
                typeField: "#node-input-triggerRuleValueType",
                types: ["str", "num", "bool"]
            });

            function refreshRuleValueVisibility() {
                var op = triggerRuleOperatorField.val();
                var needsValue = op === "eq" || op === "neq" || op === "contains";
                triggerRuleValueRow.toggle(needsValue);
            }

            function refreshVisibility() {
                var isEdge = triggerModeField.val() === "edge";
                var isRuleSource = triggerSourceField.val() === "rule";
                queueModeRow.toggle(isEdge);
                bufferModeRow.toggle(isEdge);
                releaseFormatRow.toggle(isEdge);
                triggerRuleRow.toggle(isRuleSource);
                refreshRuleValueVisibility();
            }

            triggerModeField.on("change", refreshVisibility);
            triggerSourceField.on("change", refreshVisibility);
            triggerRuleOperatorField.on("change", refreshVisibility);
            refreshVisibility();
        }
    });
</script>

<script type="text/x-red" data-template-name="dfsm-util-latch">
    <div class="form-row">
        <label for="node-input-name"><i class="icon-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-triggerMode"><i class="fa fa-toggle-on"></i> Trigger mode</label>
        <select id="node-input-triggerMode" style="width: 70%;">
            <option value="edge">edge – queue and release on trigger</option>
            <option value="gate">gate – pass through when open, discard when closed</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-triggerSource"><i class="fa fa-filter"></i> Trigger source</label>
        <select id="node-input-triggerSource" style="width: 70%;">
            <option value="topic">topic – msg.topic === "trigger"</option>
            <option value="rule">rule – trigger when rule matches</option>
        </select>
    </div>
    <div id="dfsm-latch-triggerrule-row">
        <div class="form-row">
            <label for="node-input-triggerRuleProperty"><i class="fa fa-tag"></i> Trigger property</label>
            <input type="text" id="node-input-triggerRuleProperty" style="width: 70%;">
        </div>
        <div class="form-row">
            <label for="node-input-triggerRuleOperator"><i class="fa fa-random"></i> Trigger operator</label>
            <select id="node-input-triggerRuleOperator" style="width: 70%;">
                <option value="eq">eq</option>
                <option value="neq">neq</option>
                <option value="contains">contains</option>
                <option value="exists">exists</option>
                <option value="truthy">truthy</option>
                <option value="falsy">falsy</option>
            </select>
        </div>
        <div class="form-row" id="dfsm-latch-triggerrule-value-row">
            <label for="node-input-triggerRuleValue"><i class="fa fa-pencil"></i> Trigger value</label>
            <input type="text" id="node-input-triggerRuleValue" style="width: 70%;">
            <input type="hidden" id="node-input-triggerRuleValueType">
        </div>
    </div>
    <div class="form-row" id="dfsm-latch-buffermode-row">
        <label for="node-input-bufferMode"><i class="fa fa-database"></i> Buffering mode</label>
        <select id="node-input-bufferMode" style="width: 70%;">
            <option value="one">one – replace with latest message</option>
            <option value="all">all – store all messages</option>
        </select>
    </div>
    <div class="form-row" id="dfsm-latch-queuemode-row">
        <label for="node-input-queueMode"><i class="fa fa-list-ol"></i> Queue mode</label>
        <select id="node-input-queueMode" style="width: 70%;">
            <option value="release-all">release-all – release every queued message per trigger</option>
            <option value="release-one">release-one – release only the oldest message per trigger</option>
        </select>
    </div>
    <div class="form-row" id="dfsm-latch-releaseformat-row">
        <label for="node-input-releaseFormat"><i class="fa fa-sign-out"></i> Release format</label>
        <select id="node-input-releaseFormat" style="width: 70%;">
            <option value="individual">individual – emit queued messages one at a time</option>
            <option value="payload-array">payload-array – emit one message with payload array</option>
            <option value="message-array">message-array – emit one message with full message array</option>
        </select>
    </div>
</script>

<script type="text/x-red" data-help-name="dfsm-util-latch">
    <p>A utility latch node with one physical input and one output.</p>
    <p>It supports three logical input types (message, trigger, clear). Trigger detection can come from <code>msg.topic</code> or one configured rule.</p>

    <h4>Inputs</h4>
    <p>This node has one physical input.</p>
    <p><code>clear</code> input is always selected by <code>msg.topic === "clear"</code>.</p>
    <p>Trigger detection is configured by <strong>Trigger source</strong>.</p>
    <p>Message input is any non-clear message that is not treated as a trigger.</p>
    <ul>
        <li><strong>message input</strong>: any message that is not <code>clear</code> and does not match trigger detection</li>
        <li><strong>trigger input</strong>: <code>Trigger source = topic</code> uses <code>msg.topic === "trigger"</code>; <code>Trigger source = rule</code> uses one configured rule</li>
        <li><strong>clear input</strong>: <code>msg.topic === "clear"</code></li>
    </ul>
    <p>Use a <em>change</em> node upstream to set <code>msg.topic = "trigger"</code> to release queued messages.</p>
    <p>Use a <em>change</em> node upstream to set <code>msg.topic = "clear"</code> to discard queued messages.</p>

    <h4>Output</h4>
    <p>
        Emits messages from the msg input, subject to the configured mode.
        When released from edge mode, <code>msg.trigger</code> is set to the payload
        of the trigger message that caused the release.
    </p>

    <h4>Common mode combinations</h4>
    <p>The latch has several options, but most flows use one of these patterns:</p>
    <table>
        <tr>
            <th>Pattern</th>
            <th>Configuration</th>
            <th>Behavior</th>
        </tr>
        <tr>
            <td>Latest-value latch</td>
            <td><code>edge</code> + <code>one</code> + <code>release-all</code> + <code>individual</code></td>
            <td>Keeps only the most recent message and emits it when triggered.</td>
        </tr>
        <tr>
            <td>FIFO queue</td>
            <td><code>edge</code> + <code>all</code> + <code>release-one</code> + <code>individual</code></td>
            <td>Stores all messages and releases the oldest one per trigger.</td>
        </tr>
        <tr>
            <td>Flush queue</td>
            <td><code>edge</code> + <code>all</code> + <code>release-all</code> + <code>individual</code></td>
            <td>Stores all messages and emits them individually in FIFO order when triggered.</td>
        </tr>
        <tr>
            <td>Batch payloads</td>
            <td><code>edge</code> + <code>all</code> + <code>release-all</code> + <code>payload-array</code></td>
            <td>Emits one message whose payload is an array of queued payloads.</td>
        </tr>
        <tr>
            <td>Batch full messages</td>
            <td><code>edge</code> + <code>all</code> + <code>release-all</code> + <code>message-array</code></td>
            <td>Emits one message whose payload is an array of complete queued messages.</td>
        </tr>
        <tr>
            <td>Conditional gate</td>
            <td><code>gate</code></td>
            <td>Does not queue; passes messages only while the gate is open.</td>
        </tr>
    </table>

    <h4>Trigger mode</h4>
    <dl>
        <dt>edge</dt>
        <dd>
            Messages on the msg input are queued.
            A trigger input causes queued messages to be released (subject to Queue mode).
            Buffering mode controls how many messages are stored before release.
        </dd>
        <dt>gate</dt>
        <dd>
            No queue is used.
            When the gate is <strong>open</strong> (last trigger payload was truthy),
            messages on the msg input pass through immediately.
            When the gate is <strong>closed</strong> (last trigger payload was falsy
            or no trigger has arrived yet), messages are discarded.
            Buffering mode and Queue mode do not apply in gate mode.
        </dd>
    </dl>

    <h4>Trigger source</h4>
    <dl>
        <dt>topic (default)</dt>
        <dd>Backward-compatible behavior: a trigger is any message where <code>msg.topic === "trigger"</code>.</dd>
        <dt>rule</dt>
        <dd>A trigger is any message that matches one configured rule against a selected message property.</dd>
    </dl>

    <p>Supported rule operators: <code>eq</code>, <code>neq</code>, <code>contains</code>, <code>exists</code>, <code>truthy</code>, <code>falsy</code>.</p>
    <p>Only one trigger rule is supported by design.</p>
    <p>When trigger source is <code>rule</code>, a matching rule message is consumed as a trigger and is not also queued as a data message.</p>

    <h4>Buffering mode (edge mode only)</h4>
    <dl>
        <dt>one</dt>
        <dd>Keep only the most recent msg input message. Each new message replaces the previous stored one.</dd>
        <dt>all</dt>
        <dd>Store all incoming msg input messages in a FIFO queue until they are released.</dd>
    </dl>

    <h4>Queue mode (edge mode only)</h4>
    <dl>
        <dt>release-all</dt>
        <dd>On each trigger, release every queued message in arrival order (FIFO), then clear the queue.</dd>
        <dt>release-one</dt>
        <dd>On each trigger, release only the oldest queued message (front of the FIFO queue).</dd>
    </dl>

    <h4>Release format (edge mode only)</h4>
    <dl>
        <dt>individual (default)</dt>
        <dd>Backward-compatible behavior: emit each released queued message as an individual Node-RED message.</dd>
        <dt>payload-array</dt>
        <dd>Emit one message. Set <code>msg.payload</code> to an array of queued payload values in FIFO order.</dd>
        <dt>message-array</dt>
        <dd>Emit one message. Set <code>msg.payload</code> to an array of complete queued message objects in FIFO order.</dd>
    </dl>

    <h4>Clear input</h4>
    <p>
        Any message with <code>msg.topic === "clear"</code> discards all queued messages
        without releasing them. No output is produced.
        In gate mode, clear resets the queue (which is always empty anyway) but does not
        change the gate's open/closed state.
    </p>

    <h4>FIFO guarantee</h4>
    <p>
        Queued messages are always released in arrival order.
        <em>release-one</em> always releases the oldest (first-arrived) message, not the most recent.
    </p>

    <h4>Examples</h4>

    <p><strong>edge + one + release-all:</strong>
        Only the most recent msg input is stored.
        When triggered, that single latest message is released.
        Useful as a "latest value latch" — only the last value before the trigger matters.
    </p>

    <p><strong>edge + all + release-one:</strong>
        Every msg input is queued.
        Each trigger releases only the oldest queued message.
        Useful for rate-limiting: feed messages faster than they are consumed.
    </p>

    <p><strong>edge + all + release-all + payload-array:</strong>
        Queue multiple messages and emit one batched output message per trigger.
        Useful when downstream processing expects a single array payload.</p>

    <p><strong>message-array format:</strong>
        Useful when preserving per-message metadata (for example <code>topic</code>, correlation IDs, or <code>msg.dfsm</code> fields) matters.</p>

    <p><strong>gate mode:</strong>
        Send a trigger with <code>msg.payload = true</code> to open the gate.
        Send a trigger with <code>msg.payload = false</code> to close it.
        While open, messages on the msg input pass through immediately.
        The gate starts closed on node startup.
    </p>
</script>
